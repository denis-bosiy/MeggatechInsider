name: Test project

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "*"

jobs:
  test:
    name: Test Frontend Project
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Install packages
        working-directory: ./Frontend/
        run: npm i

      - name: Run tests
        working-directory: ./Frontend/
        run: npm test
